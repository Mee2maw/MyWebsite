<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Nairo School</title>
    <link rel="stylesheet" href="assets/style.css">  
</head>
<body>
      <!--  Navigation section  -->
    <nav>        
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="courses.html">Courses</a>
        <a href="contact.html">Contact</a>        
    </nav>    

    <!--  Hero section  -->
    <section class="hero-contact">
        <h1>Contact.Us</h1>
        <p>We would love to hear from you! Please fill out the form below
           to get in touch with us.</p>
    </section>

    <section class="main-section">
        <div class="info">
            <img src="https://images.unsplash.com/photo-1588072432836-e10032774350?q=80&w=872&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
            <h2>Get in Touch</h2>
            <p>Email: info@mmm.com</p>
            <p>Phone: +254 123 456 789</p>
            <p>Location: Nairobi, Kenya</p>
        </div>
        <div class="form"> 
            <form action="">
                <label for="fullname">Fullname:</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message"  required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>
</body>
</html>
